<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MH Wilds Interactive Skill & Build App</title>
<style>
:root{--bg:#0b0d12;--surface:#141821;--surface-2:#1d2330;--border:#2a3244;--text:#f3f5f9;--text-muted:#9aa5b8;--accent:#f59e0b;--accent-soft:rgba(245,158,11,.16);--bw:#ef4444;--ba:#3b82f6;--bs:#a855f7;--bgc:#10b981}
body.theme-crimson{--bg:#12090b;--surface:#1d0f13;--surface-2:#29151b;--border:#42202a;--text:#fdf2f4;--text-muted:#c49aa4;--accent:#fb7185;--accent-soft:rgba(251,113,133,.18)}
body.theme-abyssal{--bg:#071214;--surface:#0d1f23;--surface-2:#132d33;--border:#1e454e;--text:#ecfeff;--text-muted:#8ab8c2;--accent:#2dd4bf;--accent-soft:rgba(45,212,191,.16)}
body.theme-amethyst{--bg:#0e0a17;--surface:#181126;--surface-2:#231938;--border:#382859;--text:#f5f3ff;--text-muted:#ada0cc;--accent:#c084fc;--accent-soft:rgba(192,132,252,.18)}
body.theme-slate{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--text:#f8fafc;--text-muted:#94a3b8;--accent:#38bdf8;--accent-soft:rgba(56,189,248,.18)}
body.theme-light{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef2f6;--border:#d5dde7;--text:#111827;--text-muted:#4b5563;--accent:#d97706;--accent-soft:rgba(217,119,6,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:50}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:1.2rem;font-weight:800;color:var(--accent)}
.theme-bar{display:flex;gap:6px;flex-wrap:wrap}
.theme-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer}
.theme-btn.active{border-color:var(--accent);background:var(--accent);color:#000}
.container{max-width:960px;margin:0 auto;padding:14px}
.section-box,.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px}
.section-title{font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 10px;font-weight:700}
.weapon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}
.weapon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search-wrap{display:flex;gap:8px}
.search-input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem}
.clear-btn{padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:700;cursor:pointer}
.filter-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filter-btn{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.count-label{font-size:.82rem;color:var(--text-muted);font-weight:600}
.skill-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;color:#fff;margin-bottom:4px}
.badge-Weapon{background:var(--bw)}.badge-Armor{background:var(--ba)}.badge-Set{background:var(--bs)}.badge-Group{background:var(--bgc)}
.active-skill-title{margin:2px 0 6px;font-size:1.35rem;font-weight:800}
.active-skill-desc{margin:0 0 14px;font-size:1.02rem;line-height:1.48}
.bars-wrap,.skill-list{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-label-line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;font-weight:700}
.bar-track{width:100%;height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--accent);border-radius:8px;transition:width .25s}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.action-btn{background:var(--accent);color:#000;border:none;padding:10px 14px;border-radius:10px;font-size:.88rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.action-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.skill-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer}
.skill-item.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skill-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.skill-item-name{font-size:1.12rem;font-weight:800}
.skill-item-desc{font-size:.98rem;line-height:1.45;color:var(--text-muted);margin:0 0 8px}
.skill-levels-mini{display:flex;flex-wrap:wrap;gap:6px}
.lvl-pill{background:var(--surface-2);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:.8rem;font-weight:600}
.empty-state{text-align:center;padding:28px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;color:var(--text-muted)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;padding:16px;overflow-y:auto;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:18px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;gap:8px}
.close-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer}
.build-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.build-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.build-card h3{margin:0;color:var(--accent);font-size:1.05rem}
.copy-build-btn{background:var(--accent);color:#000;border:none;padding:5px 10px;border-radius:7px;font-size:.78rem;font-weight:700;cursor:pointer}
.build-meta{font-size:.88rem;margin:4px 0;line-height:1.4}
.preview-img{width:100%;border-radius:8px;border:1px solid var(--border);margin-top:10px}
</style>
</head>
<body class="theme-obsidian">
<header><div class="header-top"><h1>MH Wilds Skill & Build App</h1><div class="theme-bar"><button class="theme-btn active" data-t="obsidian">Obsidian</button><button class="theme-btn" data-t="crimson">Crimson</button><button class="theme-btn" data-t="abyssal">Abyssal</button><button class="theme-btn" data-t="amethyst">Amethyst</button><button class="theme-btn" data-t="slate">Slate</button><button class="theme-btn" data-t="light">Light</button></div></div></header>
<div class="container">
<div class="section-box"><div class="section-title">Popular Monster Builds (All 14 Weapons)</div><div class="weapon-grid" id="weaponGrid"></div></div>
<div class="chart-card" id="chartCard"><div class="chart-header"><div><span class="skill-badge" id="activeBadge">Armor</span><h2 class="active-skill-title" id="activeTitle">Coalescence</h2></div></div><p class="active-skill-desc" id="activeDesc"></p><div class="bars-wrap" id="barsWrap"></div><div class="action-bar"><button class="action-btn" id="btnExportSingle">Save Active Chart Image</button><button class="action-btn secondary" id="btnExportFull">Save Full A-Z Poster</button></div></div>
<div class="controls"><div class="search-wrap"><input type="text" id="searchInput" class="search-input" placeholder="Search skills (e.g. Coalescence, Burst, Ballistics)..."><button class="clear-btn" id="clearSearchBtn">Reset</button></div><div class="filter-meta"><div class="filter-row"><button class="filter-btn active" data-cat="All">All (A-Z)</button><button class="filter-btn" data-cat="Weapon">Weapon</button><button class="filter-btn" data-cat="Armor">Armor</button><button class="filter-btn" data-cat="Set">Set Bonus</button><button class="filter-btn" data-cat="Group">Group</button></div><span class="count-label" id="skillCountLabel"></span></div></div>
<div class="skill-list" id="skillList"></div>
</div>
<div class="modal-backdrop" id="buildModal"><div class="modal-card"><div class="modal-header"><h2 id="modalWeaponTitle" style="margin:0;font-size:1.2rem">Builds</h2><button class="close-btn" id="closeBuildModal">Close</button></div><div id="modalBuildBody"></div></div></div>
<div class="modal-backdrop" id="imgModal"><div class="modal-card"><div class="modal-header"><h2 style="margin:0;font-size:1.1rem">Save Generated Chart</h2><button class="close-btn" id="closeImgModal">Done</button></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><p style="margin:0;font-size:.9rem;color:var(--text-muted)">Tap <strong>Download PNG</strong> or press & hold below.</p><a id="downloadPngLink" class="action-btn" download="mh-wilds-chart.png">Download PNG</a></div><img id="previewImg" class="preview-img" alt="MH Wilds Chart"></div></div>
<script>
const S=(n,c,d,l)=>({name:n,cat:c,desc:d,levels:l});
const L=(lv,val,text)=>({lv,val,text});
const SKILLS=Array.of(
let activeSkill=SKILLS.find(s=>s.name==="Coalescence")||SKILLS.at(0),currentCat="All",searchQuery="";
const $=id=>document.getElementById(id);

function applyTheme(t){
  document.body.className="theme-"+t;
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.dataset.t===t));
  try{localStorage.setItem("mh_wilds_theme",t)}catch(e){}
}

function selectSkill(s){
  activeSkill=s;
  $("activeBadge").textContent=s.cat;
  $("activeBadge").className="skill-badge badge-"+s.cat;
  $("activeTitle").textContent=s.name;
  $("activeDesc").textContent=s.desc;
  $("barsWrap").innerHTML=s.levels.map(l=>`<div class="bar-row"><div class="bar-label-line"><span>${l.lv}</span><span>${l.text}</span></div><div class="bar-track"><div class="bar-fill" style="width:${l.val}%"></div></div></div>`).join("");
  renderList();
}

function renderList(){
  const f=SKILLS.filter(s=>(currentCat==="All"||s.cat===currentCat)&&(s.name.toLowerCase().includes(searchQuery)||s.desc.toLowerCase().includes(searchQuery)));
  $("skillCountLabel").textContent=`Showing ${f.length} of ${SKILLS.length} skills`;
  const el=$("skillList");
  if(!f.length){el.innerHTML=`<div class="empty-state">No skills matched. Tap <strong>Reset</strong> to show all.</div>`;return}
  el.innerHTML="";
  f.forEach(s=>{
    const d=document.createElement("div");
    d.className="skill-item"+(s.name===activeSkill.name?" selected":"");
    d.innerHTML=`<div class="skill-item-top"><span class="skill-item-name">${s.name}</span><span class="skill-badge badge-${s.cat}">${s.cat}</span></div><p class="skill-item-desc">${s.desc}</p><div class="skill-levels-mini">${s.levels.map(l=>`<span class="lvl-pill"><strong>${l.lv}:</strong> ${l.text}</span>`).join("")}</div>`;
    d.onclick=()=>{selectSkill(s);$("chartCard").scrollIntoView({behavior:"smooth",block:"nearest"})};
    el.appendChild(d);
  });
}

function openWeaponModal(w){
  $("modalWeaponTitle").textContent=w+" — Popular Builds";
  const body=$("modalBuildBody");body.innerHTML="";
  (BUILDS.get(w)||Array.of()).forEach(b=>{
    const div=document.createElement("div");div.className="build-card";
    const txt=`MH Wilds (${w}) - ${b.title}\nBest For: ${b.monster}\nCore Skills: ${b.core}\nNotes: ${b.notes}`;
    div.innerHTML=`<div class="build-card-top"><h3>${b.title}</h3><button class="copy-build-btn">Copy Build</button></div><div class="build-meta"><strong>Best For:</strong> ${b.monster}</div><div class="build-meta"><strong>Core Skills:</strong> ${b.core}</div><div class="build-meta" style="color:var(--text-muted);margin-top:6px">${b.notes}</div>`;
    const btn=div.querySelector(".copy-build-btn");
    btn.onclick=()=>{
      const ok=()=>{btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy Build",1500)};
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok).catch(ok);else ok();
    };
    body.appendChild(div);
  });
  $("buildModal").classList.add("open");
}

function exportImage(isFull){
  const st=getComputedStyle(document.body);
  const bg=st.getPropertyValue("--bg").trim(),sf=st.getPropertyValue("--surface").trim(),sf2=st.getPropertyValue("--surface-2").trim(),bd=st.getPropertyValue("--border").trim(),tx=st.getPropertyValue("--text").trim(),mt=st.getPropertyValue("--text-muted").trim(),ac=st.getPropertyValue("--accent").trim();
  const items=isFull?SKILLS:Array.of(activeSkill),W=920;
  const mc=document.createElement("canvas").getContext("2d");mc.font="16px sans-serif";
  const prep=items.map(s=>{
    const lines=Array.of();let cur="";
    s.desc.split(" ").forEach(w=>{const t=cur?cur+" "+w:w;if(mc.measureText(t).width>W-92&&cur){lines.push(cur);cur=w}else cur=t});
    if(cur)lines.push(cur);
    return{s,lines,h:68+lines.length*22+s.levels.length*42};
  });
  let H=94;prep.forEach(p=>H+=p.h+16);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=ac;ctx.font="bold 28px sans-serif";
  ctx.fillText(isFull?"Monster Hunter Wilds — A-Z Equipment Skills":`MH Wilds Skill: ${activeSkill.name} (${activeSkill.cat})`,32,48);
  let y=78;
  prep.forEach(({s,lines,h})=>{
    ctx.fillStyle=sf;ctx.fillRect(28,y,W-56,h);ctx.strokeStyle=bd;ctx.lineWidth=2;ctx.strokeRect(28,y,W-56,h);
    ctx.fillStyle=ac;ctx.font="bold 22px sans-serif";ctx.fillText(`${s.name} (${s.cat})`,46,y+34);
    ctx.fillStyle=mt;ctx.font="16px sans-serif";let dy=y+58;lines.forEach(ln=>{ctx.fillText(ln,46,dy);dy+=22});
    let ly=dy+12;
    s.levels.forEach(l=>{
      ctx.fillStyle=tx;ctx.font="bold 16px sans-serif";ctx.fillText(`${l.lv}: ${l.text}`,46,ly);
      ctx.fillStyle=sf2;ctx.fillRect(46,ly+8,W-92,12);ctx.fillStyle=ac;ctx.fillRect(46,ly+8,(W-92)*l.val/100,12);ly+=42;
    });
    y+=h+16;
  });
  const url=cv.toDataURL("image/png");$("previewImg").src=url;$("downloadPngLink").href=url;$("imgModal").classList.add("open");
}

document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
document.querySelectorAll(".filter-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentCat=b.dataset.cat;renderList()});
$("searchInput").oninput=e=>{searchQuery=e.target.value.toLowerCase().trim();renderList()};
$("clearSearchBtn").onclick=()=>{searchQuery="";currentCat="All";$("searchInput").value="";document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.cat==="All"));renderList()};
$("closeBuildModal").onclick=()=>$("buildModal").classList.remove("open");
$("closeImgModal").onclick=()=>$("imgModal").classList.remove("open");
$("buildModal").onclick=e=>{if(e.target.id==="buildModal")$("buildModal").classList.remove("open")};
$("imgModal").onclick=e=>{if(e.target.id==="imgModal")$("imgModal").classList.remove("open")};
$("btnExportSingle").onclick=()=>exportImage(false);
$("btnExportFull").onclick=()=>exportImage(true);
BUILDS.forEach((_,w)=>{const b=document.createElement("button");b.className="weapon-btn";b.textContent=w;b.onclick=()=>openWeaponModal(w);$("weaponGrid").appendChild(b)});
try{const t=localStorage.getItem("mh_wilds_theme");if(t)applyTheme(t)}catch(e){}
selectSkill(activeSkill);
</script>
</body>
</html>
