<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>MH Wilds Interactive Skill & Build App</title>
<style>

  body.theme-crimson { --bg: #12090b; --surface: #1d0f13; --surface-2: #29151b; --border: #42202a; --text: #fdf2f4; --text-muted: #c49aa4; --accent: #fb7185; --accent-soft: rgba(251, 113, 133, 0.18); }
  body.theme-abyssal { --bg: #071214; --surface: #0d1f23; --surface-2: #132d33; --border: #1e454e; --text: #ecfeff; --text-muted: #8ab8c2; --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, 0.16); }
  body.theme-amethyst { --bg: #0e0a17; --surface: #181126; --surface-2: #231938; --border: #382859; --text: #f5f3ff; --text-muted: #ada0cc; --accent: #c084fc; --accent-soft: rgba(192, 132, 252, 0.18); }
  body.theme-slate { --bg: #0f172a; --surface: #1e293b; --surface-2: #334155; --border: #475569; --text: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --accent-soft: rgba(56, 189, 248, 0.18); }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; position: sticky; top: 0; z-index: 50; }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--accent); }
  .theme-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .theme-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 5px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
  .theme-btn.active { border-color: var(--accent); background: var(--accent); color: #000; }
  .container { max-width: 960px; margin: 0 auto; padding: 14px; }
  .section-box, .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .section-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 10px 0; font-weight: 700; }
  .weapon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 8px; }
  .weapon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 9px 10px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .search-wrap { display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; }
  .clear-btn { padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer; }
  .filter-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .filter-btn { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .count-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
  .skill-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #fff; margin-bottom: 4px; }
  .badge-Weapon { background: var(--badge-weapon); } .badge-Armor { background: var(--badge-armor); } .badge-Set { background: var(--badge-set); } .badge-Group { background: var(--badge-group); }
  .active-skill-title { margin: 2px 0 6px 0; font-size: 1.35rem; font-weight: 800; }
  .active-skill-desc { margin: 0 0 14px 0; font-size: 1.02rem; line-height: 1.48; color: var(--text); }
  .bars-wrap, .skill-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; flex-direction: column; gap: 4px; }
  .bar-label-line { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; font-weight: 700; }
  .bar-track { width: 100%; height: 16px; background: var(--surface-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 8px; transition: width 0.25s ease; }
  .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .action-btn { background: var(--accent); color: #000; border: none; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .action-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .skill-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
  .skill-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .skill-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .skill-item-name { font-size: 1.12rem; font-weight: 800; }
  .skill-item-desc { font-size: 0.98rem; line-height: 1.45; color: var(--text-muted); margin: 0 0 8px 0; }
  .skill-levels-mini { display: flex; flex-wrap: wrap; gap: 6px; }
  .lvl-pill { background: var(--surface-2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
  .empty-state { text-align: center; padding: 28px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; color: var(--text-muted); }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 100; padding: 16px; overflow-y: auto; align-items: center; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 18px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; gap: 8px; }
  .close-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .build-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .build-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }

  .copy-build-btn { background: var(--accent); color: #000; border: none; padding: 5px 10px; border-radius: 7px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .build-meta { font-size: 0.88rem; margin: 4px 0; line-height: 1.4; }
  .preview-img { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
</style>
</head>

<header>
  <div class="header-top">
    <h1>MH Wilds Skill & Build App</h1>
    <div class="theme-bar" id="themeBar">

    </div>
  </div>
</header>

<div class="container">

  </div>

  <div class="chart-card" id="chartCard">
    <div class="chart-header">
      <div>

        <h2 class="active-skill-title" id="activeTitle">Coalescence</h2>
      </div>

    <p class="active-skill-desc" id="activeDesc"></p>
    <div class="bars-wrap" id="barsWrap"></div>
    <div class="action-bar">
      <button class="action-btn" id="btnExportSingle">Save Active Chart Image</button>
      <button class="action-btn secondary" id="btnExportFull">Save Full A-Z Poster</button>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search skills (e.g. Coalescence, Burst, Agitator)...">
      <button class="clear-btn" id="clearSearchBtn" title="Reset search & filters">Reset</button>
    </div>
    <div class="filter-meta">
      <div class="filter-row" id="filterRow">

        <button class="filter-btn" data-cat="Group">Group</button>

    </div>
  </div>

  <div class="skill-list" id="skillList"></div>
</div>

<div class="modal-backdrop" id="buildModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalWeaponTitle" style="margin:0;font-size:1.2rem;">Builds</h2>
      <button class="close-btn" id="closeBuildModal">Close</button>
    </div>
    <div id="modalBuildBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="imgModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 style="margin:0;font-size:1.1rem;">Save Generated Chart</h2>
      <button class="close-btn" id="closeImgModal">Done</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
      <p style="margin:0;font-size:0.9rem;color:var(--text-muted);">

      </p>
      <a id="downloadPngLink" class="action-btn" download="mh-wilds-skill-chart.png">Download PNG</a>
    </div>
    <img id="previewImg" class="preview-img" alt="MH Wilds Chart">
  </div>
</div>

            let activeSkill = SKILLS.find(s => s.name === "Coalescence") || SKILLS.at(0);
let currentCat = "All";
let searchQuery = "";

function applyTheme(themeName) {
  document.body.className = "theme-" + themeName;
  document.querySelectorAll(".theme-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.t === themeName);
  });
  try { localStorage.setItem("mh_wilds_theme", themeName); } catch (e) {}
}

function copyTextSafe(text, btnEl) {
  const done = () => {
    btnEl.textContent = "Copied!";
    setTimeout(() => { btnEl.textContent = "Copy Build"; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, callback) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  callback();
}

function selectSkill(skill) {
  activeSkill = skill;
  document.getElementById("activeBadge").textContent = skill.cat;
  document.getElementById("activeBadge").className = "skill-badge badge-" + skill.cat;
  document.getElementById("activeTitle").textContent = skill.name;
  document.getElementById("activeDesc").textContent = skill.desc;

  const barsWrap = document.getElementById("barsWrap");
  barsWrap.innerHTML = "";
  skill.levels.forEach(l => {
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-label-line">
        <span>${l.lv}</span>
        <span>${l.text}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${l.val}%"></div>
      </div>
    `;
    barsWrap.appendChild(row);
  });

  renderList();
}

function renderList() {
  const listEl = document.getElementById("skillList");
  listEl.innerHTML = "";

  const filtered = SKILLS.filter(s => {
    const matchCat = currentCat === "All" || s.cat === currentCat;
    const matchText = s.name.toLowerCase().includes(searchQuery) || s.desc.toLowerCase().includes(searchQuery);
    return matchCat && matchText;
  });

  document.getElementById("skillCountLabel").textContent = `Showing ${filtered.length} of ${SKILLS.length} skills`;

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">No skills matched your search. Tap <strong>Reset</strong> to show all skills.</div>`;
    return;
  }

  filtered.forEach(s => {
    const card = document.createElement("div");
    card.className = "skill-item" + (s.name === activeSkill.name ? " selected" : "");
    const pills = s.levels.map(l => `<span class="lvl-pill"><strong>${l.lv}:</strong> ${l.text}</span>`).join("");
    card.innerHTML = `
      <div class="skill-item-top">
        <span class="skill-item-name">${s.name}</span>
        <span class="skill-badge badge-${s.cat}">${s.cat}</span>
      </div>
      <p class="skill-item-desc">${s.desc}</p>
      <div class="skill-levels-mini">${pills}</div>
    `;
    card.onclick = () => {
      selectSkill(s);
      document.getElementById("chartCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    listEl.appendChild(card);
  });
}

function wrapTextLines(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = new Array();
  let current = "";
  words.forEach(w => {
    const test = current ? current + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function exportImage(isFull) {
  const styles = getComputedStyle(document.body);
  const bg = styles.getPropertyValue("--bg").trim();
  const surface = styles.getPropertyValue("--surface").trim();
  const surface2 = styles.getPropertyValue("--surface-2").trim();
  const border = styles.getPropertyValue("--border").trim();
  const text = styles.getPropertyValue("--text").trim();
  const muted = styles.getPropertyValue("--text-muted").trim();
  const accent = styles.getPropertyValue("--accent").trim();

  const items = isFull ? SKILLS : new Array(activeSkill);
  const width = 920;

  const measureCanvas = document.createElement("canvas");
  const mCtx = measureCanvas.getContext("2d");
  mCtx.font = "16px sans-serif";

  const prepared = items.map(s => {
    const lines = wrapTextLines(mCtx, s.desc, width - 92);
    const cardH = 68 + (lines.length * 22) + (s.levels.length * 42);
    return { skill: s, lines, cardH };
  });

  let totalHeight = 94;
  prepared.forEach(p => { totalHeight += p.cardH + 16; });

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = totalHeight;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, totalHeight);

  ctx.fillStyle = accent;
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(isFull ? "Monster Hunter Wilds — Complete A-Z Equipment Skills" : `MH Wilds Skill: ${activeSkill.name} (${activeSkill.cat})`, 32, 48);

  let y = 78;
  prepared.forEach(({ skill: s, lines, cardH }) => {
    ctx.fillStyle = surface;
    ctx.fillRect(28, y, width - 56, cardH);
    ctx.strokeStyle = border;
    ctx.lineWidth = 2;
    ctx.strokeRect(28, y, width - 56, cardH);

    ctx.fillStyle = accent;
    ctx.font = "bold 22px sans-serif";
    ctx.fillText(`${s.name} (${s.cat})`, 46, y + 34);

    ctx.fillStyle = muted;
    ctx.font = "16px sans-serif";
    let descY = y + 58;
    lines.forEach(line => {
      ctx.fillText(line, 46, descY);
      descY += 22;
    });

    let ly = descY + 12;
    s.levels.forEach(l => {
      ctx.fillStyle = text;
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(`${l.lv}: ${l.text}`, 46, ly);

      ctx.fillStyle = surface2;
      ctx.fillRect(46, ly + 8, width - 92, 12);
      ctx.fillStyle = accent;
      ctx.fillRect(46, ly + 8, ((width - 92) * l.val) / 100, 12);
      ly += 42;
    });

    y += cardH + 16;
  });

  const dataUrl = canvas.toDataURL("image/png");
  document.getElementById("previewImg").src = dataUrl;
  const dlLink = document.getElementById("downloadPngLink");
  dlLink.href = dataUrl;
  dlLink.download = isFull ? "mh-wilds-all-skills.png" : `mh-wilds-${activeSkill.name.toLowerCase().replace(/\s+/g, "-")}.png`;
  document.getElementById("imgModal").classList.add("open");
}
